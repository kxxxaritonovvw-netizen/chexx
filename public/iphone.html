<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHEXXY — iPhone 16 Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 40%,#302837,#131116 70%);height:100dvh;display:grid;place-items:center;overflow:hidden;font-family:Arial,sans-serif}.device{position:relative;width:418px;height:898px;padding:8px;border-radius:62px;background:linear-gradient(110deg,#a49b91,#494641 18%,#b8afa5 49%,#4a4641 80%,#928980);box-shadow:0 35px 80px #0008,inset 0 0 0 1px #cbc1b5;transform:scale(var(--scale,1))}.screen{position:relative;width:402px;height:882px;border:0;border-radius:54px;overflow:clip;background:#19141f;box-shadow:0 0 0 3px #080808}.status{height:62px;background:#19141f;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 29px;font-size:15px;font-weight:600}.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:24px;z-index:5}.camera{position:absolute;right:13px;top:12px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#182b47,#080c13 65%)}iframe{display:block;width:402px;height:676px;border:0}.bottom{height:34px;background:#110c18;display:grid;place-items:center}.bottom:after{content:'';width:136px;height:5px;background:#fff;border-radius:5px}.side{position:absolute;right:-3px;top:235px;width:3px;height:90px;border-radius:2px;background:#716a62}.volume{position:absolute;left:-3px;top:181px;width:3px;height:58px;border-radius:2px;background:#716a62;box-shadow:0 73px #716a62}.label{position:fixed;bottom:14px;color:#9b929f;font-size:12px;letter-spacing:1px}
.safari{height:110px;background:#211c29;color:#fff;padding:8px 16px 0;font-family:-apple-system,"Segoe UI",sans-serif;border-top:1px solid #ffffff0b}.address{height:44px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:14px;background:#39323f;box-shadow:0 1px 8px #0003}.address input{flex:1;min-width:0;background:none;border:0;color:#fff;text-align:center;font:15px -apple-system,"Segoe UI",sans-serif;outline:none}.safari button{background:none;color:#b5c9ff;border:0;cursor:pointer;font:24px -apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:0;width:36px;height:36px}.address button{color:#eee;font-size:23px}.address #page-menu{font-size:16px}.safari-tools{display:flex;align-items:center;justify-content:space-between;height:56px}.safari-tools #back,.safari-tools #forward{font-size:36px;font-weight:300}.safari button:disabled{color:#81768b;cursor:default}.safari svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.bottom{background:#211c29}.browser-menu{position:absolute;bottom:145px;left:16px;right:16px;padding:8px;border-radius:20px;background:#302838f5;box-shadow:0 12px 40px #0008;z-index:10;backdrop-filter:blur(24px)}.browser-menu[hidden]{display:none}.browser-menu button,.browser-menu a{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:none;color:#fff;text-align:left;font:15px Arial;text-decoration:none}.browser-menu button:hover,.browser-menu a:hover{background:#ffffff12}
</style>
<div class="device"><div class="side"></div><div class="volume"></div><div class="screen"><div class="status"><span>9:41</span><span>▮▮▮ &nbsp;◉ &nbsp;▰</span></div><div class="island"><div class="camera"></div></div><iframe src="/" title="CHEXXY demo"></iframe><div class="safari" aria-label="Safari browser controls">
  <form class="address" id="address-form"><button type="button" id="page-menu" aria-label="Page menu">aA</button><input id="address" aria-label="Website address" value="localhost:5173" spellcheck="false"><button type="button" id="reload" aria-label="Reload page">↻</button></form>
  <nav class="safari-tools" aria-label="Browser toolbar">
    <button id="back" aria-label="Back" disabled>‹</button><button id="forward" aria-label="Forward" disabled>›</button>
    <button id="share" aria-label="Share demo"><svg viewBox="0 0 24 24"><path d="M12 16V2m-4 4 4-4 4 4M7 10H4v12h16V10h-3"/></svg></button>
    <button id="bookmarks" aria-label="Bookmarks"><svg viewBox="0 0 24 24"><path d="M12 5C8 2 4 3 2 4v16c3-2 7-2 10 0 3-2 7-2 10 0V4c-2-1-6-2-10 1Zm0 0v15"/></svg></button>
    <button id="tabs" aria-label="Tabs"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="15" height="15" rx="3"/><path d="M17 7V5a3 3 0 0 0-3-3H5a3 3 0 0 0-3 3v9a3 3 0 0 0 3 3h2"/></svg></button>
  </nav>
</div>
<div class="bottom"></div>
<div class="browser-menu" id="browser-menu" hidden><button data-tab="Leaderboard">Leaderboard</button><button data-tab="Events & Games">Events & Games</button><a href="/" target="_blank">Открыть демо отдельно ↗</a><button id="close-menu">Закрыть</button></div></div></div><div class="label">iPhone 16 Pro</div>
<script>function fit(){document.documentElement.style.setProperty('--scale',Math.min(1,(innerHeight-60)/898,(innerWidth-40)/418))}addEventListener('resize',fit);fit(); const frame=document.querySelector('iframe');
const address=document.querySelector('#address');
const menu=document.querySelector('#browser-menu');
const visits=['/']; let position=0;
function navigate(path){visits.splice(position+1);visits.push(path);position++;frame.src=path;updateNavigation()}
function updateNavigation(){document.querySelector('#back').disabled=position===0;document.querySelector('#forward').disabled=position===visits.length-1}
document.querySelector('#reload').onclick=()=>frame.contentWindow.location.reload();
document.querySelector('#back').onclick=()=>{if(position>0){frame.src=visits[--position];updateNavigation()}};
document.querySelector('#forward').onclick=()=>{if(position<visits.length-1){frame.src=visits[++position];updateNavigation()}};
document.querySelector('#address-form').onsubmit=(event)=>{event.preventDefault();try{const url=new URL(address.value.includes('://')?address.value:location.protocol+'//'+address.value,location.origin);if(url.origin===location.origin)navigate(url.pathname+url.search);else address.value=location.host}catch{address.value=location.host}address.blur()};
frame.addEventListener('load',()=>{address.value=location.host+ (frame.contentWindow.location.pathname==='/'?'':frame.contentWindow.location.pathname)});
for(const id of ['page-menu','bookmarks','tabs'])document.querySelector('#'+id).onclick=()=>{menu.hidden=!menu.hidden};
document.querySelector('#close-menu').onclick=()=>{menu.hidden=true};
menu.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{const tab=Array.from(frame.contentDocument.querySelectorAll('[role="tab"]')).find(tab=>tab.textContent===button.dataset.tab);tab?.click();menu.hidden=true});
document.querySelector('#share').onclick=async()=>{const url='http://192.168.10.100:5173/';if(navigator.share){try{await navigator.share({title:'CHEXXY demo',url})}catch{}}else{await navigator.clipboard.writeText(url);const button=document.querySelector('#share');button.setAttribute('aria-label','Demo link copied');button.style.color='#fff';setTimeout(()=>{button.setAttribute('aria-label','Share demo');button.style.color=''},1500)}};
</script>
</html>
